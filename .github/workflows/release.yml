name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf python3-pyside6 python3-pyxdg

      - name: Install build dependencies
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements-build.txt

      - name: Build with Nuitka (onefile)
        run: .venv/bin/python build_nuitka.py --clean --onefile

      - name: Package release tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release
           cp dist/appmeup.bin release/appmeup
           cp -r dist/src release/
          cp icon.png release/
          cp LICENSE release/

          {
            echo "[Desktop Entry]"
            echo "Version=1.0"
            echo "Type=Application"
            echo "Name=AppMeUp!"
            echo "Comment=Create and edit Chromium web apps from .desktop files"
            echo "Exec=appmeup"
            echo "Icon=mikelexp.appmeup"
            echo "Categories=Network;WebBrowser;Utility;"
            echo "Terminal=false"
            echo "StartupNotify=true"
          } > release/mikelexp.appmeup.desktop

          cp scripts/install.sh release/
          chmod +x release/install.sh release/appmeup

           cd release
           tar czf "../appmeup-${VERSION}-ubuntu-24.04-x86_64.tar.gz" \
             appmeup src icon.png LICENSE mikelexp.appmeup.desktop install.sh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
           files: appmeup-*-ubuntu-24.04-x86_64.tar.gz
